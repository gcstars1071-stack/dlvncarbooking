<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vehicle Reservation</title>
<style>
  :root{
    --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f1efe8; --text:#1f1f1d; --muted:#6b6a64;
    --hint:#98968e; --border:#e2e0d8; --border-strong:#cdcbc2;
    --accent:#185fa5; --accent-bg:#e6f1fb; --accent-tx:#0c447c;
    --own-bg:#e6f1fb; --own-tx:#0c447c; --own-bd:#85b7eb;
    --xanh-bg:#e1f5ee; --xanh-tx:#0f6e56; --xanh-bd:#5dcaa5;
    --rent-bg:#faeeda; --rent-tx:#854f0b; --rent-bd:#ef9f27;
    --danger:#a32d2d; --danger-bg:#fcebeb; --success:#0f6e56; --warn:#854f0b;
    --radius:8px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1c1b; --surface:#262625; --surface-2:#2f2f2d; --text:#ececea; --muted:#a7a59d;
      --hint:#83817a; --border:#3a3a37; --border-strong:#4a4a46;
      --accent:#5aa0e8; --accent-bg:#0c2743; --accent-tx:#b5d4f4;
      --own-bg:#0c2743; --own-tx:#b5d4f4; --own-bd:#185fa5;
      --xanh-bg:#0c3329; --xanh-tx:#9fe1cb; --xanh-bd:#0f6e56;
      --rent-bg:#3a2a0c; --rent-tx:#fac775; --rent-bd:#854f0b;
      --danger:#e88c8c; --danger-bg:#3a1414; --success:#5dcaa5; --warn:#eab35b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;}
  a{color:inherit}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    margin-bottom:14px;}
  .brand{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .portalbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);text-decoration:none;color:inherit;font-size:14px;min-height:34px;background:var(--surface);}
  .portalbtn:hover{background:var(--surface-2);}
  select,input,button,textarea{font:inherit;color:inherit;}
  select,input[type=text],input[type=password],input[type=datetime-local],input[type=time]{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:7px 9px;min-height:34px;width:100%;max-width:100%;}
  .controls select{width:auto;}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  button{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:7px 12px;cursor:pointer;min-height:34px;}
  button:hover{background:var(--surface-2);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{filter:brightness(1.05);}
  button.ghost{border-color:transparent;background:transparent;}
  button.danger{color:var(--danger);border-color:var(--border-strong);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  nav.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);overflow-x:auto;}
  nav.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;white-space:nowrap;flex:none;
    color:var(--muted);padding:8px 12px;min-height:auto;}
  nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:500;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .row{display:flex;gap:10px;align-items:center;}
  .muted{color:var(--muted)} .hint{color:var(--hint);font-size:12px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* calendar */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .calhead h2{margin:0;font-size:17px;font-weight:600;}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0;}
  .cell{min-height:88px;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;}
  .cell:hover{border-color:var(--border-strong);}
  .cell.other{opacity:.45}
  .cell.today{border-color:var(--accent);}
  .cell .dnum{font-size:12px;color:var(--muted);}
  .cell.today .dnum{color:var(--accent);font-weight:600;}
  .tag{font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;border:1px solid transparent;}
  .tag.own{background:var(--own-bg);color:var(--own-tx);border-color:var(--own-bd);}
  .tag.xanh{background:var(--xanh-bg);color:var(--xanh-tx);border-color:var(--xanh-bd);}
  .tag.rent{background:var(--rent-bg);color:var(--rent-tx);border-color:var(--rent-bd);}
  .tag.pending{border-style:dashed;opacity:.75;}

  /* day view (timeline) */
  .timeline{position:relative;margin-top:4px;}
  .trow{display:flex;gap:10px;height:46px;}
  .trow .tlabel{width:52px;color:var(--muted);font-size:12px;flex:none;padding-top:2px;}
  .trow .cellbg{flex:1;border-top:1px solid var(--border);border-radius:4px;cursor:pointer;
    color:var(--hint);font-size:12px;padding:3px 8px;}
  .trow .cellbg:hover{background:var(--surface-2);}
  .events{position:absolute;top:0;left:62px;right:0;bottom:0;pointer-events:none;}
  .evt{position:absolute;border-radius:6px;padding:4px 7px;font-size:12px;overflow:hidden;
    box-sizing:border-box;pointer-events:auto;cursor:pointer;border:1px solid transparent;line-height:1.35;}
  .evt.own{background:var(--own-bg);color:var(--own-tx);border-color:var(--own-bd);}
  .evt.xanh{background:var(--xanh-bg);color:var(--xanh-tx);border-color:var(--xanh-bd);}
  .evt.rent{background:var(--rent-bg);color:var(--rent-tx);border-color:var(--rent-bd);}
  .evt.pending{border-style:dashed;}
  .evt b{font-weight:600;}
  .badge{font-size:10px;border-radius:20px;padding:1px 7px;border:1px solid var(--border-strong);}
  .badge.confirmed{background:var(--xanh-bg);color:var(--xanh-tx);border-color:var(--xanh-bd);}
  .badge.pending{background:var(--rent-bg);color:var(--rent-tx);border-color:var(--rent-bd);}
  .badge.rejected{background:var(--danger-bg);color:var(--danger);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:5vh 16px;overflow:auto;z-index:50;}
  .modal{background:var(--surface);border-radius:14px;border:1px solid var(--border);width:100%;
    max-width:480px;padding:18px;}
  .modal h3{margin:0 0 12px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field > label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:96px;}
  .seg button.sel{border-color:var(--accent);color:var(--accent-tx);background:var(--accent-bg);}
  .destrow{display:flex;gap:6px;margin-bottom:6px;}
  .destrow input{flex:1;}
  .err{color:var(--danger);font-size:12px;margin-top:6px;}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .approvrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .chk{font-size:12px;display:inline-flex;align-items:center;gap:4px;}
  .chk.yes{color:var(--success)} .chk.no{color:var(--danger)} .chk.wait{color:var(--muted)}
  table.vt{width:100%;border-collapse:collapse;font-size:13px;}
  table.vt td,table.vt th{border-bottom:1px solid var(--border);padding:6px 6px;text-align:left;vertical-align:top;}
  .blockchip{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border-radius:6px;
    padding:2px 7px;font-size:12px;margin:2px 4px 2px 0;}
  .notice{background:var(--surface-2);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:13px;}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .userarea{display:flex;gap:8px;align-items:center;}
  .permgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 14px;}
  .permgrid label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text);cursor:pointer;}
  @media (max-width:560px){
    .wrap{padding:12px;}
    .cell{min-height:58px;padding:3px;}
    .cell .tag{font-size:10px;padding:1px 3px;}
    .brand{font-size:16px}
    .calhead{flex-wrap:wrap;gap:8px}
    .modal{padding:14px}
    .seg button{min-width:0}
    header.top{gap:8px}
  }
</style>
</head>

</div>

  view:"month",

function t(k){ return I18N[state.lang][k]; }

/* ---------------- helpers ---------------- */
function pad(n){return String(n).padStart(2,"0");}
function fmtDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;}
function addDays(str,n){const d=new Date(str+"T00:00");d.setDate(d.getDate()+n);return fmtDate(d);}
function uid(){return Math.random().toString(36).slice(2,9);}
function dt(dateStr,timeStr){return new Date(dateStr+"T"+timeStr);}
function overlaps(aStart,aEnd,bStart,bEnd){return aStart < bEnd && aEnd > bStart;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// lightweight password obfuscation (NOT strong crypto — prototype level)
function hashPw(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++){ h=(((h<<5)+h)^s.charCodeAt(i))>>>0; } return "h"+h.toString(16); }

/* ---------------- persistence + seed ---------------- */
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ state.data=JSON.parse(raw); return; } }catch(e){}
  state.data=seed();
  save();
}
function save(){
  if(USE_FIREBASE && fbDoc){ fbDoc.set(state.data).catch(e=>console.error("save failed",e)); return; }
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state.data)); }catch(e){}
}
// restore login session from the loaded accounts, then draw
let hashHandled=false, ssoChecked=false;
function afterLoad(){
  const sess=localStorage.getItem("veh_session");
  state.user = (sess && state.data.accounts) ? (state.data.accounts.find(a=>a.id===sess)||null) : null;
  if(!hashHandled){ hashHandled=true; const mh=(location.hash||"").match(/d=(\d{4}-\d{2}-\d{2})/); if(mh){ state.selDate=mh[1]; state.view="day"; } } // deep-link from Telegram link
  if(!ssoChecked){ ssoChecked=true; bootstrapSso().then(ch=>{ if(ch) render(); }); } // single sign-on from Task
  render();
}
/* Bridge the server-side SSO session (HttpOnly cookie set by /api/sso/consume)
   into the app: /api/me returns the verified identity, which we map to a Car
   account (linked by ssoSubject, created minimal-perms on first sight). */
async function bootstrapSso(){
  const q=new URLSearchParams(location.search);
  if(q.get("sso")==="failed"){ q.delete("sso"); const qs=q.toString(); history.replaceState({},"",location.pathname+(qs?"?"+qs:"")+location.hash); toast(t("sso_failed")); }
  let me=null;
  try{ const r=await fetch("/api/me",{credentials:"same-origin"}); if(r.ok) me=(await r.json()).user; }catch(e){ return false; }
  if(!me || !me.ssoSubject) return false;
  if(!state.data.accounts) state.data.accounts=[];
  let acc=state.data.accounts.find(a=>a.ssoSubject===me.ssoSubject);
  if(!acc){
    acc={ id:"fg_"+me.sub, name:me.name||me.username||me.sub, department:"", isAdmin:false, ssoSubject:me.ssoSubject,
      perms:{seeDetails:false,calCreate:true,resvEdit:false,apprView:false,apprEdit:false,vehView:false,vehEdit:false,repView:false} };
    state.data.accounts.push(acc); save();
  }
  state.user=acc; localStorage.setItem("veh_session",acc.id);
  return true;
}
// shared mode: keep one Firestore document (app/data) in sync with state.data
function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  fbDoc = firebase.firestore().collection("app").doc("data");
  let seeded=false;
  fbDoc.onSnapshot(snap=>{
    if(!snap.exists){ if(!seeded){ seeded=true; fbDoc.set(seed()); } return; }
    state.data = snap.data();
    afterLoad();
  }, err=>{ console.error(err); alert("Firebase connection error: "+err.message); });
}

/* ---------------- domain logic ---------------- */
const GUEST_PERMS={seeDetails:false,calCreate:true,resvEdit:false,apprView:false,apprEdit:false,vehView:false,vehEdit:false,repView:false};
function fullPerms(){return {seeDetails:true,calCreate:true,resvEdit:true,apprView:true,apprEdit:true,vehView:true,vehEdit:true,repView:true};}
function perms(){ if(!state.user) return GUEST_PERMS; if(state.user.isAdmin) return fullPerms(); return Object.assign({},GUEST_PERMS,state.user.perms||{}); }
function P(k){ return !!perms()[k]; }
function isAdmin(){ return !!(state.user && state.user.isAdmin); }
function canSeeDetails(){ return P("seeDetails"); }
function vehicleById(id){ return state.data.vehicles.find(v=>v.id===id); }

function visibleReservations(dateStr){
  return state.data.reservations.filter(r=>{
    if(r.date!==dateStr) return false;
    if(r.status==="rejected") return false;
    if(!P("seeDetails") && r.status!=="confirmed") return false;
    return true;
  }).sort((a,b)=>a.startTime.localeCompare(b.startTime));
}
function transportLabel(r){
  if(r.transportMode==="own"){
    if(r.vehicleId && r.vehicleId!=="REQUEST"){ const v=vehicleById(r.vehicleId); return v?v.name:t("t_own"); }
    return t("vehReq");
  }
  if(r.transportMode==="xanh") return t("t_xanh");
  return t("t_rent");
}
/* ---- trip leg rendering (From/To/Detail, backward-compatible with old {place,note}) ---- */
function isUrl(s){ return typeof s==="string" && /^https?:\/\//i.test(s.trim()); }
function placeHtml(name,url){ const n=esc(name||""); return isUrl(url)?`<a href="${esc(url.trim())}" target="_blank" rel="noopener">${n||esc(url.trim())}</a>`:n; }
function legPlain(d){
  if(d.to||d.from){ const f=d.from||"", to=d.to||""; let s=(f&&to)?f+" → "+to:(to||f); if(d.detail) s+=" ("+d.detail+")"; return s; }
  return (d.place||"")+(d.note?" ("+d.note+")":""); // old records
}
function legHtml(d){
  if(d.to||d.from){ const f=placeHtml(d.from,d.fromUrl), to=placeHtml(d.to,d.toUrl);
    let s=(d.from&&d.to)?f+" → "+to:(d.to?to:f); if(d.detail) s+=" <span class='muted'>("+esc(d.detail)+")</span>"; return s; }
  return esc(d.place||"")+(d.note?" <span class='muted'>("+esc(d.note)+")</span>":""); // old records
}
function paxText(r){ return (r.passengers&&r.passengers.length)? r.passengers.filter(Boolean).join(", "):""; }
const DEFAULT_DEPTS=["AD","PM","PD","QM","others"];
function departments(){ const d=state.data&&state.data.departments; return (Array.isArray(d)&&d.length)?d:DEFAULT_DEPTS; }
function userLabel(r){ return r.userName + (r.department? " ["+r.department+"]" : ""); }
function resvNo(r){ return r.no? "["+r.no+"] " : ""; }
// reservation code: DDMMYYYY-## based on the reservation date + that day's next sequence
function makeResvNo(dateStr){
  const [Y,M,D]=dateStr.split("-"); const base=D+M+Y;
  const seqs=(state.data.reservations||[]).filter(x=>typeof x.no==="string" && x.no.indexOf(base+"-")===0)
    .map(x=>parseInt(x.no.split("-")[1],10)||0);
  const n=(seqs.length?Math.max.apply(null,seqs):0)+1;
  return base+"-"+String(n).padStart(2,"0");
}
function tgRecipients(){
  // only the admin-registered individuals; the group id is added server-side
  return (state.data.telegramRecipients||[]).map(r=>r&&r.id?String(r.id).trim():"").filter(Boolean);
}
/* send text via the backend proxy; returns {chatId: message_id}. opts.replyTo = {chatId: message_id} to thread as a reply */
async function tgSend(text,opts){
  if(!USE_TELEGRAM) return {};
  try{
    const r=await fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text, recipients:tgRecipients(), replyTo:(opts&&opts.replyTo)||{}})});
    if(!r.ok) return {};
    return await r.json();
  }catch(e){ console.warn("Telegram send",e); return {}; }
}
function resvLines(r,header){
  return [ header,
    "• User: "+userLabel(r),
    "• Date: "+r.date+"  "+r.startTime+"–"+r.endTime,
    "• Transport: "+transportLabel(r),
    (r.destinations&&r.destinations.length? "• Trip: "+r.destinations.map(legPlain).join(", "):""),
    (paxText(r)? "• Passengers: "+paxText(r):"")
  ].filter(Boolean);
}
/* new reservation submitted → needs approval (store per-chat message ids for later reply) */
async function notifyTelegram(r){
  if(!USE_TELEGRAM || !r) return;
  const L=resvLines(r,"🚗 New reservation / 새 차량 예약  ["+(r.no||"?")+"]"); L.push("• Status: pending — needs approval");
  const ids=await tgSend(L.join("\n"));
  const rec=state.data.reservations.find(x=>x.id===r.id); if(rec){ rec.tgMsgIds=ids; save(); }
}
/* reservation confirmed → confirmed alert, replied onto the original request message */
async function notifyTelegramConfirmed(r){
  if(!USE_TELEGRAM || !r) return;
  const L=resvLines(r,"✅ Confirmed schedule / 배차 확정  ["+(r.no||"?")+"]"); L.push("• Status: confirmed");
  L.push("• Open: "+location.origin+location.pathname+"#d="+r.date);
  await tgSend(L.join("\n"), {replyTo: r.tgMsgIds||{}});
}
function vehicleAvailable(vehicleId,dateStr,startTime,endTime){
  const v=vehicleById(vehicleId); if(!v) return true;
  const s=timeToMin(startTime), e=timeToMin(endTime);
  return !v.blocks.some(b=>{
    if(b.daily){
      if(b.weekdaysOnly){ const wd=new Date(dateStr+"T00:00").getDay(); if(wd===0||wd===6) return false; } // skip Sat/Sun
      return overlapMin(s,e,timeToMin(b.startTime),timeToMin(b.endTime)); // recurring
    }
    const bd0=b.start.slice(0,10), bd1=b.end.slice(0,10);
    if(dateStr<bd0||dateStr>bd1) return false;
    const bs=dateStr===bd0?timeToMin(b.start.slice(11,16)):0;
    const be=dateStr===bd1?timeToMin(b.end.slice(11,16)):24*60;
    return overlapMin(s,e,bs,be);
  });
}
function timeToMin(tp){ return parseInt(tp.slice(0,2),10)*60 + parseInt(tp.slice(3,5),10); }
function minToTime(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
function overlapMin(s1,e1,s2,e2){ return s1<e2 && e1>s2; }
// busy time ranges (in minutes) for a vehicle on a day: own-car reservations + maintenance blocks
function busyIntervals(vehicleId,dateStr,excludeId){
  const out=[];
  state.data.reservations.forEach(r=>{
    if(r.id===excludeId||r.date!==dateStr||r.status==="rejected") return;
    if(r.transportMode!=="own"||r.vehicleId!==vehicleId) return;
    out.push([timeToMin(r.startTime),timeToMin(r.endTime)]);
  });
  const v=vehicleById(vehicleId);
  if(v) v.blocks.forEach(b=>{
    if(b.daily){ if(b.weekdaysOnly){ const wd=new Date(dateStr+"T00:00").getDay(); if(wd===0||wd===6) return; } out.push([timeToMin(b.startTime),timeToMin(b.endTime)]); return; } // recurring
    const bd0=b.start.slice(0,10), bd1=b.end.slice(0,10);
    if(dateStr<bd0||dateStr>bd1) return;
    const s = dateStr===bd0 ? timeToMin(b.start.slice(11,16)) : 0;
    const e = dateStr===bd1 ? timeToMin(b.end.slice(11,16)) : 24*60;
    out.push([s,e]);
  });
  return out;
}
function mergeIntervals(iv){
  const a=iv.slice().sort((x,y)=>x[0]-y[0]), m=[];
  a.forEach(([s,e])=>{ if(m.length&&s<=m[m.length-1][1]) m[m.length-1][1]=Math.max(m[m.length-1][1],e); else m.push([s,e]); });
  return m;
}
// nearest 15-min-aligned start that fits `dur`, closest to wantStart, avoiding busy ranges
function findFreeSlot(busy,wantStart,dur,lo,hi){
  const m=mergeIntervals(busy), gaps=[]; let cur=lo;
  m.forEach(([s,e])=>{ if(s>cur) gaps.push([cur,Math.min(s,hi)]); cur=Math.max(cur,e); });
  if(cur<hi) gaps.push([cur,hi]);
  let best=null,bestD=Infinity;
  gaps.forEach(([gs,ge])=>{
    const g0=Math.ceil(gs/15)*15, g1=Math.floor(ge/15)*15;
    if(g1-g0<dur) return;
    const cand=Math.min(Math.max(wantStart,g0),g1-dur);
    const d=Math.abs(cand-wantStart);
    if(d<bestD){ bestD=d; best=cand; }
  });
  return best;
}

/* ---------------- render root ---------------- */
const app=document.getElementById("app");
function render(){
  document.documentElement.lang=state.lang;
  document.getElementById("appTitle").textContent=t("appTitle");
  document.title=t("appTitle");
  // guard views against current permissions
  if(state.view==="approvals" && !P("apprView")) state.view="month";
  if(state.view==="vehicles" && !P("vehView")) state.view="month";
  if(state.view==="reports" && !P("repView")) state.view="month";
  if(state.view==="users" && !isAdmin()) state.view="month";
  if(state.view==="alerts" && !isAdmin()) state.view="month";
  renderUserArea();
  renderTabs();
  if(state.view==="month") renderMonth();
  else if(state.view==="day") renderDay();
  else if(state.view==="approvals") renderApprovals();
  else if(state.view==="vehicles") renderVehicles();
  else if(state.view==="reports") renderReports();
  else if(state.view==="users") renderUsers();

}

/* ---------------- month view ---------------- */
function renderMonth(){
  const y=state.cursor.getFullYear(), m=state.cursor.getMonth();
  const monthName=new Intl.DateTimeFormat(I18N[state.lang].locale,{month:"long",year:"numeric"}).format(state.cursor);
  const first=new Date(y,m,1);
  const startIdx=(first.getDay()+6)%7; // Monday=0
  const gridStart=new Date(y,m,1-startIdx);
  const todayStr=fmtDate(new Date());
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const ds=fmtDate(d);
    const other=d.getMonth()!==m;
    const isToday=ds===todayStr;
    const rs=visibleReservations(ds);
    const tags=rs.slice(0,3).map(r=>
      `<span class="tag ${r.transportMode} ${r.status==='pending'?'pending':''}">${esc(transportLabel(r))}</span>`).join("");
    const more=rs.length>3?`<span class="hint">+${rs.length-3}</span>`:"";
    cells+=`<div class="cell ${other?'other':''} ${isToday?'today':''}" data-date="${ds}">
      <div class="dnum">${d.getDate()}</div>${tags}${more}</div>`;
  }
  const dow=I18N[state.lang].weekdays.map(w=>`<div class="dow">${esc(w)}</div>`).join("");

  const todays=visibleReservations(todayStr);
  const todayList = todays.length ? todays.map(r=>`<div class="row" style="justify-content:space-between;gap:8px;border-top:1px solid var(--border);padding:8px 0">
      <div><b>${esc(transportLabel(r))}</b> · ${esc(userLabel(r))} <span class="hint">${r.startTime}–${r.endTime}</span>
      ${canSeeDetails()&&(r.destinations.length||paxText(r))?`<div class="hint">${r.destinations.map(legHtml).join(", ")}${paxText(r)?" · 👥 "+esc(paxText(r)):""}</div>`:""}</div>
      <span class="badge ${r.status}">${esc(t("st_"+r.status))}</span></div>`).join("")
    : `<p class="hint" style="margin:8px 0 0">${esc(t("noToday"))}</p>`;

  app.innerHTML=`
    <div class="calhead">
      <div class="row">
        <button id="prevM">‹</button>
        <h2>${esc(monthName)}</h2>
        <button id="nextM">›</button>
        <button id="todayBtn" class="ghost">${esc(t("today"))}</button>
      </div>
      ${P("calCreate")?`<button id="applyBtn" class="primary">${esc(t("newResv"))}</button>`:""}
    </div>
    <div class="grid7" style="margin-bottom:6px">${dow}</div>
    <div class="grid7">${cells}</div>
    ${!canSeeDetails()?`<p class="hint" style="margin-top:10px">${esc(t("hiddenNote"))}</p>`:""}
    <div class="card" style="margin-top:16px">
      <h2 style="font-size:15px;margin:0 0 2px">${esc(t("todaySchedule"))} · ${todayStr}</h2>
      ${todayList}
    </div>
  `;
  document.getElementById("prevM").onclick=()=>{state.cursor=new Date(y,m-1,1);render();};
  document.getElementById("nextM").onclick=()=>{state.cursor=new Date(y,m+1,1);render();};
  document.getElementById("todayBtn").onclick=()=>{state.cursor=startOfMonth(new Date());render();};
  const applyB=document.getElementById("applyBtn");
  if(applyB) applyB.onclick=()=>openModal(todayStr,"09:00");
  document.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{
    state.selDate=c.dataset.date; state.view="day"; render();
  });
}

/* ---------------- day view ---------------- */
const ROW_H=46, DAY_START=7, DAY_END=20;
function hourOf(tp){ return parseInt(tp,10) + (parseInt(tp.slice(3),10)||0)/60; }
function renderDay(){
  const ds=state.selDate;
  const dLabel=new Intl.DateTimeFormat(I18N[state.lang].locale,{weekday:"long",month:"long",day:"numeric"}).format(new Date(ds+"T00:00"));

      <div class="cellbg" data-time="${label}">${esc(t("clickBook"))}</div></div>`;
  }

  // position + column-pack overlapping reservations
  const evs=rs.map(r=>{
    const s=Math.max(DAY_START,hourOf(r.startTime));
    let e=hourOf(r.endTime); if(!(e>s)) e=s+1; e=Math.min(DAY_END,e);
    return {r,s,e,col:0,ncols:1};
  }).sort((a,b)=>a.s-b.s||a.e-b.e);
  let i=0;
  while(i<evs.length){
    let maxEnd=evs[i].e, j=i+1;
    while(j<evs.length && evs[j].s<maxEnd){ maxEnd=Math.max(maxEnd,evs[j].e); j++; }
    const cluster=evs.slice(i,j), colEnds=[];
    cluster.forEach(ev=>{
      let placed=false;
      for(let c=0;c<colEnds.length;c++){ if(colEnds[c]<=ev.s){ ev.col=c; colEnds[c]=ev.e; placed=true; break; } }
      if(!placed){ ev.col=colEnds.length; colEnds.push(ev.e); }
    });
    cluster.forEach(ev=>ev.ncols=colEnds.length);
    i=j;
  }
  const evHtml=evs.map(ev=>{
    const top=(ev.s-DAY_START)*ROW_H+2;
    const height=(ev.e-ev.s)*ROW_H-4;
    const w=100/ev.ncols, left=ev.col*w;
    return `<div class="evt ${ev.r.transportMode} ${ev.r.status==='pending'?'pending':''}" data-id="${ev.r.id}"
      style="top:${top}px;height:${height}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px)">
      ${evtInner(ev.r)}</div>`;
  }).join("");

  const totalH=(DAY_END-DAY_START)*ROW_H;
  app.innerHTML=`
    <div class="calhead">
      <div class="row"><button id="backBtn" class="ghost">‹ ${esc(t("back"))}</button>
      <h2 style="margin-left:6px">${esc(dLabel)}</h2></div>
      ${P("calCreate")?`<button id="addBtn" class="primary">${esc(t("newResv"))}</button>`:""}
    </div>
    <div class="timeline" style="height:${totalH}px">
      <div class="rows">${rows}</div>
      <div class="events">${evHtml}</div>
    </div>
    ${!canSeeDetails()?`<p class="hint" style="margin-top:10px">${esc(t("hiddenNote"))}</p>`:""}
  `;
  document.getElementById("backBtn").onclick=()=>{state.view="month";render();};
  const addB=document.getElementById("addBtn");
  if(addB) addB.onclick=()=>openModal(ds,"09:00");
  if(P("calCreate")) app.querySelectorAll(".cellbg").forEach(b=>b.onclick=()=>openModal(ds,b.dataset.time));
  app.querySelectorAll(".evt").forEach(el=>el.onclick=()=>{
    const r=state.data.reservations.find(x=>x.id===el.dataset.id);
    if(r) openModal(r.date,r.startTime,r);
  });
}
function evtInner(r){
  const details = canSeeDetails() && (r.destinations.length || paxText(r))
    ? `<div class="hint" style="margin-top:2px">${r.destinations.map(legHtml).join(" / ")}${paxText(r)?" · 👥 "+esc(paxText(r)):""}</div>` : "";
  return `<div class="row" style="justify-content:space-between;gap:6px;align-items:flex-start">
      <b>${esc(resvNo(r))}${esc(transportLabel(r))} · ${esc(userLabel(r))}</b>
      <span class="badge ${r.status}">${esc(t("st_"+r.status))}</span></div>
    <div class="hint">${r.startTime}–${r.endTime}</div>${details}`;
}

/* ---------------- reservation modal ---------------- */
function openModal(dateStr,timeStr,existing){
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id:null,date:dateStr,startTime:timeStr,endTime:minToTime(Math.min(DAY_END*60,timeToMin(timeStr)+60)),userName:"",department:"",
    transportMode:null,vehicleId:null,destinations:[{from:"",fromUrl:"",to:"",toUrl:"",detail:""}],passengers:["",""]
  };
  if(!Array.isArray(draft.destinations)||!draft.destinations.length) draft.destinations=[{from:"",fromUrl:"",to:"",toUrl:"",detail:""}];
  if(!Array.isArray(draft.passengers)) draft.passengers=["",""];
  // editing existing needs resvEdit, OR apprEdit while the item is still pending (assign/adjust during approval)
  const canEdit = existing ? (P("resvEdit") || (P("apprEdit") && existing.status==="pending")) : true;
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  const modal=ov.querySelector(".modal");

  function timeOptions(sel){
    let o=""; for(let m=DAY_START*60;m<=DAY_END*60;m+=15){const v=minToTime(m); o+=`<option value="${v}" ${v===sel?"selected":""}>${v}</option>`;}
    return o;
  }
  function destCount(){ return draft.destinations.filter(d=>(d.to||d.place||"").trim()).length; }

  function draw(){
    if(existing && !canEdit){ drawReadOnly(); return; }
    const rentUnlocked=destCount()>=2;
    if(draft.transportMode==="rent" && !rentUnlocked) draft.transportMode=null;
    modal.innerHTML=`
      <h3>${esc(existing?t("editResv"):t("newResv"))}</h3>
      <div class="field"><label>${esc(t("f_user"))}</label>
        <div class="row">
          <input type="text" id="mUser" value="${esc(draft.userName)}" placeholder="${esc(t("f_user"))}" style="flex:1">
          <select id="mDept" style="flex:none;width:auto;min-width:110px">
            <option value="">${esc(t("f_dept"))}</option>
            ${(departments().includes(draft.department)||!draft.department?departments():[draft.department,...departments()]).map(d=>`<option value="${esc(d)}" ${d===draft.department?"selected":""}>${esc(d)}</option>`).join("")}
          </select>
        </div></div>
      <div class="field"><label>${esc(t("f_time"))}</label>
        <div class="row">
          <select id="mStart">${timeOptions(draft.startTime)}</select>
          <span class="muted">–</span>
          <select id="mEnd">${timeOptions(draft.endTime)}</select>
        </div></div>
      <div class="field"><label>${esc(t("f_transport"))}</label>
        <div class="seg" id="mSeg">
          <button data-mode="own" class="${draft.transportMode==='own'?'sel':''}">${esc(t("t_own"))}</button>
          <button data-mode="xanh" class="${draft.transportMode==='xanh'?'sel':''}">${esc(t("t_xanh"))}</button>
          <button data-mode="rent" class="${draft.transportMode==='rent'?'sel':''}" ${rentUnlocked?"":"disabled title='"+esc(t("rentHint"))+"'"}>
            ${esc(t("t_rent"))} ${rentUnlocked?"":"🔒"}</button>
        </div>
        ${rentUnlocked?"":`<div class="hint" style="margin-top:5px">${esc(t("rentHint"))}</div>`}
      </div>
      <div class="field" id="vehWrap" ${draft.transportMode==="own"?"":"hidden"}>
        <label>${esc(t("f_vehicle"))}</label>
        <select id="mVeh">${vehicleOptions()}</select>
      </div>
      <div class="field"><label>${esc(t("f_dest"))}</label>
        <div id="destList"></div>
        <button id="addDest" class="ghost" style="padding:4px 8px">＋ ${esc(t("addDest"))}</button>
      </div>
      <div class="field"><label>${esc(t("f_passengers"))}</label>
        <div id="paxList"></div>
        <button id="addPax" class="ghost" style="padding:4px 8px">＋ ${esc(t("addPassenger"))}</button>
      </div>
      ${existing?`<div class="field"><label>${esc(t("f_status"))}</label>
        <div class="seg" id="mStatus">
          ${["pending","confirmed","rejected"].map(s=>`<button data-st="${s}" class="${draft.status===s?'sel':''}">${esc(t("st_"+s))}</button>`).join("")}
        </div></div>`:""}
      <div class="err" id="mErr" hidden></div>
      <div class="actions">
        ${existing && P("resvEdit")?`<button id="mDelete" class="danger" style="margin-right:auto">${esc(t("del"))}</button>`:""}
        <button id="mCancel">${esc(t("cancel"))}</button>
        <button id="mSave" class="primary">${esc(t("save"))}</button>
      </div>`;
    drawDest(); drawPax();
    if(existing){
      modal.querySelectorAll("#mStatus button").forEach(b=>b.onclick=()=>{ draft.status=b.dataset.st; draw(); });
      const delBtn=modal.querySelector("#mDelete");
      if(delBtn) delBtn.onclick=()=>{
        const act=modal.querySelector(".actions");
        act.innerHTML=`<span style="margin-right:auto;color:var(--danger);font-size:13px">${esc(t("confirmDelete"))}</span>
          <button id="mDelNo">${esc(t("cancel"))}</button>
          <button id="mDelYes" class="danger">${esc(t("del"))}</button>`;
        modal.querySelector("#mDelNo").onclick=()=>draw();
        modal.querySelector("#mDelYes").onclick=()=>{
          state.data.reservations=state.data.reservations.filter(x=>x.id!==draft.id);
          save(); ov.remove(); render();
        };
      };
    }
    modal.querySelector("#mUser").oninput=e=>draft.userName=e.target.value;
    modal.querySelector("#mDept").onchange=e=>draft.department=e.target.value;
    modal.querySelector("#mStart").onchange=e=>{draft.startTime=e.target.value; refreshVeh();};
    modal.querySelector("#mEnd").onchange=e=>{draft.endTime=e.target.value; refreshVeh();};
    modal.querySelectorAll("#mSeg button").forEach(b=>b.onclick=()=>{
      if(b.disabled) return;
      draft.transportMode=b.dataset.mode;
      if(draft.transportMode==="own" && !draft.vehicleId){ draft.vehicleId="REQUEST"; } // default to dispatch request
      draw();
    });
    const veh=modal.querySelector("#mVeh"); if(veh) veh.onchange=e=>draft.vehicleId=e.target.value;
    modal.querySelector("#addDest").onclick=()=>{draft.destinations.push({from:"",fromUrl:"",to:"",toUrl:"",detail:""}); draw();};
    modal.querySelector("#addPax").onclick=()=>{draft.passengers.push(""); draw();};
    modal.querySelector("#mCancel").onclick=()=>ov.remove();
    modal.querySelector("#mSave").onclick=onSave;
    if(draft._notice){const el=modal.querySelector("#mErr");el.textContent=draft._notice;el.style.color="var(--warn)";el.hidden=false;delete draft._notice;}
  }
  function refreshVeh(){
    const veh=modal.querySelector("#mVeh");
    if(veh){ veh.innerHTML=vehicleOptions(); veh.onchange=e=>draft.vehicleId=e.target.value; }
  }
  function vehicleOptions(){
    const reqSel = (!draft.vehicleId || draft.vehicleId==="REQUEST") ? "selected" : "";
    return `<option value="REQUEST" ${reqSel}>${esc(t("requestVehicle"))}</option>`+state.data.vehicles.map(v=>{
      const ok=vehicleAvailable(v.id,draft.date,draft.startTime,draft.endTime);
      const rlabel=ok?"":" ("+t("blockedBy")+")";
      return `<option value="${v.id}" ${v.id===draft.vehicleId?"selected":""} ${ok?"":"disabled"}>${esc(v.name)} — ${esc(v.type)}${rlabel}</option>`;
    }).join("");
  }
  function drawDest(){
    const list=modal.querySelector("#destList");
    list.innerHTML=draft.destinations.map((d,i)=>`
      <div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px">
        <div class="row" style="justify-content:space-between;margin-bottom:4px">
          <span class="hint">#${i+1}</span>
          ${draft.destinations.length>1?`<button class="ghost danger" data-del="${i}" style="min-width:auto;padding:0 6px">✕</button>`:""}
        </div>
        <div class="destrow"><input type="text" data-i="${i}" data-k="from" value="${esc(d.from||d.place||"")}" placeholder="${esc(t("f_from"))}">
          <input type="text" data-i="${i}" data-k="fromUrl" value="${esc(d.fromUrl||"")}" placeholder="${esc(t("f_mapUrl"))}"></div>
        <div class="destrow"><input type="text" data-i="${i}" data-k="to" value="${esc(d.to||"")}" placeholder="${esc(t("f_to"))}">
          <input type="text" data-i="${i}" data-k="toUrl" value="${esc(d.toUrl||"")}" placeholder="${esc(t("f_mapUrl"))}"></div>
        <div class="destrow"><input type="text" data-i="${i}" data-k="detail" value="${esc(d.detail||d.note||"")}" placeholder="${esc(t("f_detail"))}"></div>
      </div>`).join("");
    list.querySelectorAll("input").forEach(inp=>inp.oninput=e=>{
      draft.destinations[+e.target.dataset.i][e.target.dataset.k]=e.target.value;
      updateRentLock(); // re-eval rent lock without losing focus
    });
    list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      draft.destinations.splice(+b.dataset.del,1); draw();
    });
  }
  function drawPax(){
    const list=modal.querySelector("#paxList");
    while(draft.passengers.length<2) draft.passengers.push("");
    list.innerHTML=draft.passengers.map((p,i)=>`
      <div class="destrow">
        <input type="text" data-pi="${i}" value="${esc(p)}" placeholder="${esc(t("f_passengers"))} ${i+1}">
        ${draft.passengers.length>2?`<button class="ghost danger" data-pdel="${i}" style="min-width:auto;padding:4px 8px">✕</button>`:""}
      </div>`).join("");
    list.querySelectorAll("input").forEach(inp=>inp.oninput=e=>{ draft.passengers[+e.target.dataset.pi]=e.target.value; });
    list.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{ draft.passengers.splice(+b.dataset.pdel,1); draw(); });
  }
  function updateRentLock(){
    const unlocked=destCount()>=2;
    const rentBtn=modal.querySelector('#mSeg button[data-mode="rent"]');
    if(!rentBtn) return;
    if(unlocked){ rentBtn.disabled=false; rentBtn.innerHTML=esc(t("t_rent")); }
    else{ rentBtn.disabled=true; rentBtn.innerHTML=esc(t("t_rent"))+" 🔒";
      if(draft.transportMode==="rent"){ draft.transportMode=null; draw(); } }
  }
  function onSave(){
    let newRec=null, confirmedRec=null;
    const err=modal.querySelector("#mErr");
    const show=m=>{err.textContent=m;err.style.color="var(--danger)";err.hidden=false;};
    if(!draft.userName.trim()) return show(t("err_user"));
    if(!(draft.endTime>draft.startTime)) return show(t("err_time"));
    if(!draft.transportMode) return show(t("err_transport"));
    if(draft.transportMode==="own"){
      if(!draft.vehicleId) draft.vehicleId="REQUEST";
      if(draft.vehicleId!=="REQUEST"){ // a specific vehicle is assigned → check conflicts
        const s=timeToMin(draft.startTime), e=timeToMin(draft.endTime), dur=e-s;
        const busy=busyIntervals(draft.vehicleId,draft.date,draft.id);
        if(busy.some(([bs,be])=>overlapMin(s,e,bs,be))){
          const ns=findFreeSlot(busy,s,dur,DAY_START*60,DAY_END*60);
          if(ns==null) return show(t("err_novehicletime"));
          draft.startTime=minToTime(ns); draft.endTime=minToTime(ns+dur);
          draft._notice=t("warn_adjusted").replace("{t}",draft.startTime+"–"+draft.endTime);
          return draw();
        }
      }
    }
    if(!draft.destinations.some(d=>(d.to||d.from||d.place||"").trim())) return show(t("err_place"));
    draft.destinations=draft.destinations.filter(d=>(d.from||d.to||d.detail||d.fromUrl||d.toUrl||d.place||d.note||"").toString().trim());
    draft.passengers=(draft.passengers||[]).map(s=>(s||"").trim()).filter(Boolean);
    if(draft.transportMode!=="own") draft.vehicleId=null;
    if(existing){
      const idx=state.data.reservations.findIndex(x=>x.id===draft.id);
      if(idx>=0){
        const prev=state.data.reservations[idx];
        if(draft.status!==prev.status) draft.decidedAt=Date.now();
        const merged={...prev,...draft};
        state.data.reservations[idx]=merged;
        if(draft.status==="confirmed" && prev.status!=="confirmed") confirmedRec=merged; // just confirmed via edit
      }
    }else{
      newRec={...draft,id:uid(),no:makeResvNo(draft.date),status:"pending",approvals:{admin:null,fleet:null},createdAt:Date.now()};
      state.data.reservations.push(newRec);
    }
    save(); ov.remove(); render();
    if(!existing){ toast(t("savedPending")); notifyTelegram(newRec); }
    if(confirmedRec) notifyTelegramConfirmed(confirmedRec);
  }
  function drawReadOnly(){
    const r=existing;
    const dest = canSeeDetails()
      ? (r.destinations||[]).map(d=>`<li>${legHtml(d)}</li>`).join("")
      : `<li class="muted">${esc(t("hiddenNote"))}</li>`;
    const pax = canSeeDetails() && paxText(r)
      ? `<div class="field"><label>${esc(t("f_passengers"))}</label><div>${esc(paxText(r))}</div></div>` : "";
    modal.innerHTML=`
      <h3>${esc(transportLabel(r))} · ${esc(userLabel(r))}</h3>
      <p class="muted" style="margin:0 0 10px">${esc(r.date)} · ${r.startTime}–${r.endTime}
        <span class="badge ${r.status}" style="margin-left:6px">${esc(t("st_"+r.status))}</span></p>
      <div class="field"><label>${esc(t("f_dest"))}</label><ul style="margin:4px 0 0;padding-left:18px">${dest}</ul></div>
      ${pax}
      <div class="actions"><button id="roClose" class="primary">${esc(t("cancel"))}</button></div>`;
    modal.querySelector("#roClose").onclick=()=>ov.remove();
  }
  draw();
}

/* ---------------- approvals view ---------------- */
function renderApprovals(){
  if(!P("apprView")){
    app.innerHTML=`<div class="notice">${esc(t("accessDenied"))}</div>`; return;
  }
  const canAct=P("apprEdit"), canEdit=P("resvEdit"), canEditPending=P("apprEdit")||P("resvEdit");
  const info=r=>`<b>${esc(resvNo(r))}${esc(transportLabel(r))} · ${esc(userLabel(r))}</b>
      <div class="hint">${esc(r.date)} · ${r.startTime}–${r.endTime}${r.destinations.length?" · "+esc(r.destinations.map(legPlain).join(", ")):""}${paxText(r)?" · 👥 "+esc(paxText(r)):""}</div>`;

  const pend=state.data.reservations.filter(r=>r.status==="pending")
    .sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));
  const pendRows = pend.length? pend.map(r=>`<div class="approvrow">
      <div class="apinfo" ${canEditPending?`data-edit="${r.id}" style="cursor:pointer"`:""}>${info(r)}</div>
      ${canAct?`<div class="row" style="flex-wrap:wrap;gap:6px">
        <button data-edit="${r.id}">${esc(t("editAssign"))}</button>
        <button class="primary" data-act="approve" data-id="${r.id}">${esc(t("approve"))}</button>
        <button class="danger" data-act="reject" data-id="${r.id}">${esc(t("reject"))}</button>
      </div>`:""}
    </div>`).join("") : `<div class="notice">${esc(t("ap_empty"))}</div>`;

  const approved=state.data.reservations.filter(r=>r.status==="confirmed")
    .sort((a,b)=>(b.decidedAt||b.createdAt||0)-(a.decidedAt||a.createdAt||0)).slice(0,15);
  const apprRows = approved.length? approved.map(r=>`<div class="approvrow" ${canEdit?`data-edit="${r.id}" style="cursor:pointer"`:""}>
      <div>${info(r)}</div>
      <span class="badge confirmed">${esc(t("st_confirmed"))}</span>
    </div>`).join("") : `<div class="notice">${esc(t("ap_approvedEmpty"))}</div>`;

  app.innerHTML=`<h2 style="font-size:17px;margin:0 0 4px">${esc(t("ap_title"))}</h2>
    <p class="hint" style="margin:0 0 12px">${esc(t("ap_note"))}</p>${pendRows}
    <h2 style="font-size:16px;margin:22px 0 4px">${esc(t("ap_approvedTitle"))}</h2>
    <p class="hint" style="margin:0 0 12px">${esc(t("ap_clickEdit"))}</p>${apprRows}`;

  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const r=state.data.reservations.find(x=>x.id===b.dataset.id); if(!r) return;
    const slot = isAdmin()?"admin":"fleet";
    if(b.dataset.act==="reject"){ r.approvals[slot]=false; r.status="rejected"; r.decidedAt=Date.now(); save(); renderApprovals(); return; }
    // approve: a dispatch request must have a vehicle assigned first → open editor to assign
    if(r.transportMode==="own" && (!r.vehicleId || r.vehicleId==="REQUEST")){ toast(t("assignFirst")); openModal(r.date,r.startTime,r); return; }
    r.approvals[slot]=true; r.status="confirmed"; r.decidedAt=Date.now();
    save(); renderApprovals(); notifyTelegramConfirmed(r);
  });
  app.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>{
    const r=state.data.reservations.find(x=>x.id===el.dataset.edit);
    if(r) openModal(r.date,r.startTime,r);
  });
}

      <div class="row" style="flex-wrap:wrap;gap:8px">
        <input type="text" id="nvName" placeholder="${esc(t("v_name"))}" style="flex:1;min-width:140px">
        <input type="text" id="nvType" placeholder="${esc(t("v_type"))}" style="flex:1;min-width:140px">
        <button id="nvAdd" class="primary">${esc(t("v_add"))}</button>
      </div>
      <div class="err" id="nvErr" hidden></div>
    </div>`:""}
    <div class="tablewrap"><table class="vt">
      <thead><tr><th>${esc(t("v_name"))}</th><th>${esc(t("v_blocks"))}</th>${canEdit?"<th></th>":""}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  if(!canEdit) return;
  document.getElementById("nvAdd").onclick=()=>{
    const n=document.getElementById("nvName").value.trim();
    const ty=document.getElementById("nvType").value.trim();
    const err=document.getElementById("nvErr");
    if(!n){err.textContent=t("err_vname");err.hidden=false;return;}
    state.data.vehicles.push({id:uid(),name:n,type:ty||"-",blocks:[]}); save(); renderVehicles();
  };
  app.querySelectorAll("[data-delveh]").forEach(b=>b.onclick=()=>{
    state.data.vehicles=state.data.vehicles.filter(v=>v.id!==b.dataset.delveh); save(); renderVehicles();
  });
  app.querySelectorAll("[data-delblock]").forEach(b=>b.onclick=()=>{
    const [vid,bid]=b.dataset.delblock.split(":");
    const v=vehicleById(vid); if(v){ v.blocks=v.blocks.filter(x=>x.id!==bid); save(); renderVehicles(); }
  });
  app.querySelectorAll("[data-addblock]").forEach(b=>b.onclick=()=>{
    const vid=b.dataset.addblock;
    const reason=app.querySelector(`select[data-r="${vid}"]`).value;
    const s=app.querySelector(`input[data-s="${vid}"]`).value;
    const e=app.querySelector(`input[data-e="${vid}"]`).value;
    const err=app.querySelector(`[data-berr="${vid}"]`);
    if(!s||!e||!(new Date(e)>new Date(s))){err.textContent=t("err_block");err.hidden=false;return;}
    const v=vehicleById(vid);
    v.blocks.push({id:uid(),reason,start:s.slice(0,16),end:e.slice(0,16)}); save(); renderVehicles();
  });
  app.querySelectorAll("[data-adddaily]").forEach(b=>b.onclick=()=>{
    const vid=b.dataset.adddaily;
    const reason=app.querySelector(`select[data-dr="${vid}"]`).value;
    const s=app.querySelector(`input[data-ds="${vid}"]`).value;
    const e=app.querySelector(`input[data-de="${vid}"]`).value;
    const wd=app.querySelector(`input[data-dwd="${vid}"]`).checked;
    const err=app.querySelector(`[data-berr="${vid}"]`);
    if(!s||!e||!(e>s)){err.textContent=t("err_block");err.hidden=false;return;}
    vehicleById(vid).blocks.push({id:uid(),reason,daily:true,weekdaysOnly:wd,startTime:s,endTime:e}); save(); renderVehicles();
  });
}
function fmtBlock(iso){ return iso.replace("T"," "); }

/* ---------------- weekly report view ---------------- */
function fmtMD(d){ return new Intl.DateTimeFormat(I18N[state.lang].locale,{month:"short",day:"numeric"}).format(d); }
function fmtHrs(min){ return (min/60).toFixed(1)+" "+t("rp_h"); }
function renderReports(){
  if(!P("repView")){ app.innerHTML=`<div class="notice">${esc(t("accessDenied"))}</div>`; return; }
  if(!state.weekStart) state.weekStart=mondayOf(new Date());
  const ws=state.weekStart, we=new Date(ws); we.setDate(ws.getDate()+6);
  const wsStr=fmtDate(ws), weStr=fmtDate(we);
  const items=state.data.reservations.filter(r=>r.status!=="rejected" && r.date>=wsStr && r.date<=weStr)
    .sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));
  const totalMin=items.reduce((s,r)=>s+(timeToMin(r.endTime)-timeToMin(r.startTime)),0);
  const ownTrips=items.filter(r=>r.transportMode==="own").length;
  const modeCount={own:0,xanh:0,rent:0}; items.forEach(r=>modeCount[r.transportMode]++);
  const vehMin={}; items.filter(r=>r.transportMode==="own").forEach(r=>{
    vehMin[r.vehicleId]=(vehMin[r.vehicleId]||0)+(timeToMin(r.endTime)-timeToMin(r.startTime));
  });

  const metric=(label,val)=>`<div style="background:var(--surface-2);border-radius:var(--radius);padding:12px 14px">
    <div class="hint">${esc(label)}</div><div style="font-size:22px;font-weight:600;margin-top:2px">${esc(val)}</div></div>`;
  const metrics=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px">
    ${metric(t("rp_total"),String(items.length))}
    ${metric(t("rp_hours"),fmtHrs(totalMin))}
    ${metric(t("rp_vehTrips"),String(ownTrips))}
  </div>`;

  const modeRow=(k,label)=>`<span class="blockchip">${esc(label)}: <b>${modeCount[k]}</b> ${esc(t("rp_trips"))}</span>`;
  const modeBreak=`<div style="margin-bottom:12px"><div class="hint" style="margin-bottom:4px">${esc(t("rp_byMode"))}</div>
    ${modeRow("own",t("t_own"))}${modeRow("xanh",t("t_xanh"))}${modeRow("rent",t("t_rent"))}</div>`;
  const vehIds=Object.keys(vehMin);
  const vehBreak=vehIds.length?`<div style="margin-bottom:14px"><div class="hint" style="margin-bottom:4px">${esc(t("rp_byVeh"))}</div>
    ${vehIds.map(id=>{const v=vehicleById(id);return `<span class="blockchip">${esc(v?v.name:id)}: <b>${fmtHrs(vehMin[id])}</b></span>`;}).join("")}</div>`:"";

  const showDest=canSeeDetails();
  const rows=items.length? items.map(r=>{
    const wd=I18N[state.lang].weekdays[(new Date(r.date+"T00:00").getDay()+6)%7];
    const dest=showDest? esc(r.destinations.map(legPlain).join(", ")+(paxText(r)?" · 👥 "+paxText(r):"")):"";
    return `<tr>
      <td>${esc(r.date)} <span class="hint">${esc(wd)}</span></td>
      <td>${esc(userLabel(r))}</td>
      <td>${esc(transportLabel(r))}</td>
      <td>${r.startTime}–${r.endTime}</td>
      <td><span class="badge ${r.status}">${esc(t("st_"+r.status))}</span></td>
      ${showDest?`<td>${dest}</td>`:""}
    </tr>`;
  }).join("") : `<tr><td colspan="${showDest?6:5}" class="muted">${esc(t("rp_none"))}</td></tr>`;

  const isThisWeek=fmtDate(mondayOf(new Date()))===wsStr;
  app.innerHTML=`
    <div class="calhead">
      <div class="row"><h2 style="margin:0;font-size:17px">${esc(t("rp_title"))}</h2></div>
      <div class="row">
        <button id="rpPrev" class="ghost">${esc(t("rp_prev"))}</button>
        <button id="rpThis" class="ghost" ${isThisWeek?"disabled":""}>${esc(t("rp_thisweek"))}</button>
        <button id="rpNext" class="ghost">${esc(t("rp_next"))}</button>
      </div>
    </div>
    <p class="muted" style="margin:0 0 12px">${esc(fmtMD(ws))} – ${esc(fmtMD(we))} · <span class="hint">${esc(t("rp_auto"))}</span></p>
    ${metrics}${modeBreak}${vehBreak}
    <div class="tablewrap"><table class="vt">
      <thead><tr><th>${esc(t("rp_date"))}</th><th>${esc(t("rp_user"))}</th><th>${esc(t("rp_transport"))}</th>
      <th>${esc(t("rp_time"))}</th><th>${esc(t("rp_status"))}</th>${showDest?`<th>${esc(t("rp_dest"))}</th>`:""}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="row" style="margin-top:14px;gap:10px">
      <button id="rpCopy">${esc(t("rp_copy"))}</button>
      <span id="rpMsg" class="hint" hidden>${esc(t("rp_copied"))}</span>
    </div>`;
  document.getElementById("rpPrev").onclick=()=>{const d=new Date(ws);d.setDate(d.getDate()-7);state.weekStart=d;render();};
  document.getElementById("rpNext").onclick=()=>{const d=new Date(ws);d.setDate(d.getDate()+7);state.weekStart=d;render();};
  document.getElementById("rpThis").onclick=()=>{state.weekStart=mondayOf(new Date());render();};
  document.getElementById("rpCopy").onclick=()=>{
    const txt=buildReportText(wsStr,weStr,items,totalMin,ownTrips,modeCount,vehMin,showDest);
    navigator.clipboard.writeText(txt).then(()=>{const m=document.getElementById("rpMsg");m.hidden=false;setTimeout(()=>m.hidden=true,2500);});
  };
}
function buildReportText(wsStr,weStr,items,totalMin,ownTrips,modeCount,vehMin,showDest){
  const L=[];
  L.push(`${t("rp_title")} (${wsStr} ~ ${weStr})`);
  L.push(`${t("rp_total")}: ${items.length}  |  ${t("rp_hours")}: ${(totalMin/60).toFixed(1)}  |  ${t("rp_vehTrips")}: ${ownTrips}`);
  L.push(`${t("rp_byMode")}: ${t("t_own")} ${modeCount.own} / ${t("t_xanh")} ${modeCount.xanh} / ${t("t_rent")} ${modeCount.rent}`);
  Object.keys(vehMin).forEach(id=>{const v=vehicleById(id);L.push(`  - ${v?v.name:id}: ${(vehMin[id]/60).toFixed(1)} ${t("rp_h")}`);});
  L.push("");
  items.forEach(r=>{
    let line=`${r.date} ${r.startTime}-${r.endTime}  ${userLabel(r)}  ${transportLabel(r)}  [${t("st_"+r.status)}]`;
    if(showDest && r.destinations.length) line+=`  ${r.destinations.map(legPlain).join(", ")}`;
    if(showDest && paxText(r)) line+=`  [${paxText(r)}]`;
    L.push(line);
  });
  if(!items.length) L.push(t("rp_none"));
  return L.join("\n");
}

/* ---------------- Telegram recipients (admin-managed, stored in Firestore) ---------------- */
function renderAlerts(){
  if(!isAdmin()){ app.innerHTML=`<div class="notice">${esc(t("accessDenied"))}</div>`; return; }
  if(!Array.isArray(state.data.telegramRecipients)) state.data.telegramRecipients=[];
  const recs=state.data.telegramRecipients;
  const groupId=(String(TELEGRAM.chatId||"").startsWith("PASTE"))?"":String(TELEGRAM.chatId||"");
  const rows = recs.length? recs.map((r,i)=>`<tr>
      <td><b>${esc(r.name||"")}</b></td><td class="hint">${esc(String(r.id))}</td>
      <td><button class="danger" data-delrec="${i}">${esc(t("remove"))}</button></td></tr>`).join("")
    : `<tr><td colspan="3" class="muted">${esc(t("al_none"))}</td></tr>`;
  app.innerHTML=`
    <h2 style="font-size:17px;margin:0 0 4px">${esc(t("al_title"))}</h2>
    <p class="hint" style="margin:0 0 4px">${esc(t("al_desc"))}</p>
    ${groupId?`<p class="hint" style="margin:0 0 12px">${esc(t("al_group"))}: ${esc(groupId)}</p>`:""}
    <div class="card" style="margin-bottom:12px">
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <input type="text" id="alName" placeholder="${esc(t("al_name"))}" style="flex:1;min-width:120px">
        <input type="text" id="alId" placeholder="${esc(t("al_chatid"))}" style="flex:1;min-width:140px">
        <button id="alAdd" class="primary">${esc(t("al_add"))}</button>
      </div>
      <div class="err" id="alErr" hidden></div>
    </div>
    <div class="row" style="gap:10px;margin-bottom:8px">
      <button id="alFetch">${esc(t("al_fetch"))}</button>
      <span class="hint">${esc(t("al_fetchHint"))}</span>
    </div>
    <div id="alFetchList" style="margin-bottom:12px"></div>
    <div class="tablewrap"><table class="vt">
      <thead><tr><th>${esc(t("al_name"))}</th><th>${esc(t("al_chatid"))}</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  const addRec=(name,id)=>{
    id=String(id).trim(); name=(name||"").trim();
    if(!/^-?\d+$/.test(id)){ const e=document.getElementById("alErr"); e.textContent=t("err_chatid"); e.hidden=false; return false; }
    if(!recs.some(r=>String(r.id)===id)) recs.push({name:name||id,id});
    save(); renderAlerts(); return true;
  };
  document.getElementById("alAdd").onclick=()=>addRec(document.getElementById("alName").value,document.getElementById("alId").value);
  app.querySelectorAll("[data-delrec]").forEach(b=>b.onclick=()=>{ recs.splice(+b.dataset.delrec,1); save(); renderAlerts(); });
  document.getElementById("alFetch").onclick=async()=>{
    const list=document.getElementById("alFetchList");
    list.innerHTML=`<span class="hint">…</span>`;
    try{
      const g=await (await fetch("/api/tg-updates?_="+Date.now())).json();
      const seen={};
      (g.result||[]).forEach(c=>{ if(c && c.id){ seen[c.id]={id:String(c.id), name:[c.first_name,c.last_name].filter(Boolean).join(" ")||c.username||String(c.id)}; } });
      const news=Object.values(seen).filter(s=>!recs.some(r=>String(r.id)===s.id));
      list.innerHTML = news.length? news.map(s=>`<div class="approvrow"><div><b>${esc(s.name)}</b> <span class="hint">${esc(s.id)}</span></div>
        <button class="primary" data-addnew="${esc(s.id)}" data-nm="${esc(s.name)}">${esc(t("al_add"))}</button></div>`).join("")
        : `<div class="notice">${esc(t("al_noNew"))}</div>`;
      list.querySelectorAll("[data-addnew]").forEach(b=>b.onclick=()=>addRec(b.dataset.nm,b.dataset.addnew));
    }catch(e){ list.innerHTML=`<div class="notice">${esc(String(e))}</div>`; }
  };
}

/* ---------------- toast ---------------- */
function toast(msg){
  const d=document.createElement("div"); d.textContent=msg;
  d.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:100;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90%";
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}

/* ---------------- login ---------------- */
function openLogin(){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal" style="max-width:360px"></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  const m=ov.querySelector(".modal");
  m.innerHTML=`<h3>${esc(t("loginTitle"))}</h3>
    <div class="field"><label>${esc(t("u_id"))}</label><input type="text" id="lgId" autocomplete="username"></div>
    <div class="field"><label>${esc(t("u_pw"))}</label><input type="password" id="lgPw" autocomplete="current-password"></div>
    <div class="err" id="lgErr" hidden></div>
    <div class="actions"><button id="lgCancel">${esc(t("cancel"))}</button><button id="lgGo" class="primary">${esc(t("login"))}</button></div>
    <p class="hint" style="margin-top:12px">${esc(t("demoAccounts"))}</p>`;
  const go=()=>{
    const id=m.querySelector("#lgId").value.trim(), pw=m.querySelector("#lgPw").value;
    const acc=state.data.accounts.find(a=>a.id===id && a.password===hashPw(pw));
    if(!acc){ const e=m.querySelector("#lgErr"); e.textContent=t("loginFail"); e.hidden=false; return; }
    state.user=acc; localStorage.setItem("veh_session",acc.id); ov.remove(); render();
  };
  m.querySelector("#lgGo").onclick=go;
  m.querySelector("#lgCancel").onclick=()=>ov.remove();
  m.querySelector("#lgPw").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  m.querySelector("#lgId").focus();
}

/* ---------------- user management (admin) ---------------- */
const PERM_DEFS=[["seeDetails","perm_seeDetails"],["calCreate","perm_calCreate"],["resvEdit","perm_resvEdit"],
  ["apprView","perm_apprView"],["apprEdit","perm_apprEdit"],["vehView","perm_vehView"],["vehEdit","perm_vehEdit"],["repView","perm_repView"]];
function renderUsers(){
  if(!isAdmin()){ app.innerHTML=`<div class="notice">${esc(t("accessDenied"))}</div>`; return; }
  const rows=state.data.accounts.map(a=>{
    const summary = a.isAdmin ? t("u_admin")
      : (PERM_DEFS.filter(([k])=>a.perms&&a.perms[k]).map(([k,lbl])=>t(lbl)).join(", ") || "—");
    return `<tr>
      <td><b>${esc(a.id)}</b><div class="hint">${esc(a.name)}</div></td>
      <td class="hint">${esc(summary)}</td>
      <td style="white-space:nowrap">
        <button data-euser="${esc(a.id)}">${esc(t("u_edit"))}</button>
        ${a.id!=="admin"?`<button class="danger" data-duser="${esc(a.id)}">${esc(t("remove"))}</button>`:""}
      </td></tr>`;
  }).join("");
  app.innerHTML=`
    <div class="calhead">
      <h2 style="margin:0;font-size:17px">${esc(t("u_title"))}</h2>
      <button id="addUser" class="primary">${esc(t("u_add"))}</button>
    </div>
    <div class="tablewrap"><table class="vt">
      <thead><tr><th>${esc(t("u_id"))}</th><th>${esc(t("u_perms"))}</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <h2 style="font-size:16px;margin:22px 0 8px">${esc(t("u_depts"))}</h2>
    <div class="card">
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        ${departments().map((d,i)=>`<span class="blockchip">${esc(d)}
          <button class="ghost danger" data-deldept="${i}" style="min-width:auto;padding:0 4px">✕</button></span>`).join("")}
      </div>
      <div class="row" style="gap:8px">
        <input type="text" id="ndName" placeholder="${esc(t("u_addDept"))}" style="flex:1;min-width:140px">
        <button id="ndAdd" class="primary">${esc(t("al_add"))}</button>
      </div>
    </div>`;
  document.getElementById("addUser").onclick=()=>openUserEditor(null);
  app.querySelectorAll("[data-euser]").forEach(b=>b.onclick=()=>{
    const a=state.data.accounts.find(x=>x.id===b.dataset.euser); if(a) openUserEditor(a);
  });
  app.querySelectorAll("[data-duser]").forEach(b=>b.onclick=()=>{
    state.data.accounts=state.data.accounts.filter(x=>x.id!==b.dataset.duser); save(); renderUsers();
  });
  // departments (stored in Firestore; editable without redeploy)
  if(!Array.isArray(state.data.departments)) state.data.departments=DEFAULT_DEPTS.slice();
  document.getElementById("ndAdd").onclick=()=>{
    const v=document.getElementById("ndName").value.trim();
    if(v && !state.data.departments.includes(v)){ state.data.departments.push(v); save(); renderUsers(); }
  };
  app.querySelectorAll("[data-deldept]").forEach(b=>b.onclick=()=>{
    state.data.departments.splice(+b.dataset.deldept,1); save(); renderUsers();
  });
}
function openUserEditor(acc){
  const editing=!!acc;
  const draft = acc ? JSON.parse(JSON.stringify(acc)) : {id:"",password:"",name:"",isAdmin:false,perms:Object.assign({},GUEST_PERMS)};
  const origHash = acc ? acc.password : null; draft.password=""; // never expose stored hash
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal"></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  const m=ov.querySelector(".modal");
  function draw(){
    m.innerHTML=`<h3>${esc(editing?t("editUser"):t("newUser"))}</h3>
      <div class="field"><label>${esc(t("u_id"))}</label>
        <input type="text" id="uId" value="${esc(draft.id)}" ${editing?"disabled":""}></div>
      <div class="field"><label>${esc(t("u_name"))}</label><input type="text" id="uName" value="${esc(draft.name)}"></div>
      <div class="field"><label>${esc(t("u_pw"))}</label><input type="text" id="uPw" value="${esc(draft.password)}" placeholder="${editing?esc(t("u_pwKeep")):""}"></div>
      <div class="field"><label class="permgrid" style="grid-template-columns:1fr"><span style="display:flex;gap:8px;align-items:center">
        <input type="checkbox" id="uAdmin" ${draft.isAdmin?"checked":""}> ${esc(t("u_admin"))}</span></label></div>
      <div class="field" id="permWrap" ${draft.isAdmin?"hidden":""}>
        <label>${esc(t("u_perms"))}</label>
        <div class="permgrid">
          ${PERM_DEFS.map(([k,lbl])=>`<label><input type="checkbox" data-perm="${k}" ${draft.perms[k]?"checked":""}> ${esc(t(lbl))}</label>`).join("")}
        </div>
      </div>
      <div class="err" id="uErr" hidden></div>
      <div class="actions"><button id="uCancel">${esc(t("cancel"))}</button><button id="uSave" class="primary">${esc(t("save"))}</button></div>`;
    m.querySelector("#uId").oninput=e=>draft.id=e.target.value;
    m.querySelector("#uName").oninput=e=>draft.name=e.target.value;
    m.querySelector("#uPw").oninput=e=>draft.password=e.target.value;
    m.querySelector("#uAdmin").onchange=e=>{ draft.isAdmin=e.target.checked; draw(); };
    m.querySelectorAll("[data-perm]").forEach(c=>c.onchange=e=>{ draft.perms[e.target.dataset.perm]=e.target.checked; });
    m.querySelector("#uCancel").onclick=()=>ov.remove();
    m.querySelector("#uSave").onclick=onSave;
  }
  function onSave(){
    const err=m.querySelector("#uErr"); const show=x=>{err.textContent=x;err.hidden=false;};
    const id=draft.id.trim();
    if(!id) return show(t("err_uid"));
    if(!editing && state.data.accounts.some(a=>a.id===id)) return show(t("err_uid_dup"));
    if(!editing && !draft.password) return show(t("err_upw"));
    draft.id=id; draft.name=draft.name.trim()||id;
    draft.password = draft.password ? hashPw(draft.password) : origHash; // blank on edit keeps old
    if(editing){
      const idx=state.data.accounts.findIndex(a=>a.id===draft.id);
      state.data.accounts[idx]=draft;
      if(state.user && state.user.id===draft.id) state.user=draft;
    }else{
      state.data.accounts.push(draft);
    }
    save(); ov.remove(); render();
  }
  draw();
}
